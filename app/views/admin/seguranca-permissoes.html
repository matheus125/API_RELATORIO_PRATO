<main class="app-main"><div class="app-content-header"><div class="container-fluid"><div class="portal-page-header"><div class="portal-kicker"><i class="bi bi-shield-lock"></i> Gestão de perfis</div><h1 class="portal-page-title">Permissões por perfil</h1><p class="portal-page-subtitle">Gerencie a matriz de acesso do sistema por perfil, mantendo governança e segurança nas rotas administrativas.</p></div></div></div><div class="app-content"><div class="container-fluid"><form method="post" action="/admin/seguranca/permissoes"><div class="card"><div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2"><h3 class="card-title mb-0">Matriz de permissões</h3><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i> Salvar permissões</button></div><div class="card-body">{loop="$permissions"}<div class="row g-3 align-items-center py-3 border-bottom"><div class="col-lg-4"><div class="fw-bold">{$value.module_name}</div><div class="text-muted small">{$value.description}</div><div class="text-primary small mt-1">{$value.permission_key}</div></div><div class="col-lg-8"><div class="d-flex gap-3 flex-wrap"><label class="form-check form-check-inline m-0"><input class="form-check-input" type="checkbox" name="permissions[ADMIN][]" value="{$value.permission_key}" {if="in_array($value.permission_key, $admin_permissions)"}checked{/if}> <span class="form-check-label fw-semibold">ADMIN</span></label><label class="form-check form-check-inline m-0"><input class="form-check-input" type="checkbox" name="permissions[SUPERVISOR][]" value="{$value.permission_key}" {if="in_array($value.permission_key, $supervisor_permissions)"}checked{/if}> <span class="form-check-label fw-semibold">SUPERVISOR</span></label><label class="form-check form-check-inline m-0"><input class="form-check-input" type="checkbox" name="permissions[ASSESSOR][]" value="{$value.permission_key}" {if="in_array($value.permission_key, $assessor_permissions)"}checked{/if}> <span class="form-check-label fw-semibold">ASSESSOR</span></label></div></div></div>{/loop}</div></div></form></div></div></main>
