<div class="content-wrapper">
  <main class="app-main">
    <div class="app-content px-3 px-md-4 py-4">
      <section class="portal-page-header">
        <span class="portal-kicker"><i class="fa-solid fa-user-pen"></i> Edição de cadastro</span>
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
          <div>
            <h1 class="portal-page-title">Editar funcionário</h1>
            <p class="portal-page-subtitle">Atualize dados do usuário mantendo o mesmo padrão visual premium do restante do sistema.</p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <a href="/admin/funcionarios" class="btn btn-light"><i class="fa-solid fa-arrow-left me-2"></i>Voltar</a>
            <a href="/admin/funcionarios/{$funcionarios.id_usuario}/password" class="btn btn-warning text-white"><i class="fa-solid fa-key me-2"></i>Alterar senha</a>
          </div>
        </div>
      </section>

      <form id="form-funcionario" action="/admin/funcionarios/{$funcionarios.id_usuario}" method="post">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h3 class="card-title mb-0"><i class="fa-solid fa-user-gear me-2 text-primary"></i>Dados do usuário</h3>
            <span class="badge rounded-pill badge-soft-primary px-3 py-2">ID #{$funcionarios.id_usuario}</span>
          </div>
          <div class="card-body">
            <div class="row g-4">
              <div class="col-12 col-lg-6">
                <label for="nome_funcionario" class="form-label fw-semibold">Nome completo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                  <input type="text" class="form-control" id="nome_funcionario" name="nome_funcionario" value="{$funcionarios.nome_funcionario}" placeholder="Digite o nome completo" required>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <label for="cpf" class="form-label fw-semibold">CPF / Login</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                  <input type="text" class="form-control" id="cpf" name="cpf" value="{$funcionarios.cpf}" placeholder="Digite o CPF" required>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <label for="nrphone" class="form-label fw-semibold">Telefone</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                  <input type="text" class="form-control" id="nrphone" name="nrphone" value="{$funcionarios.nrphone}" placeholder="(92) 99999-9999">
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                  <input type="email" class="form-control" id="email" name="email" value="{$funcionarios.email}" placeholder="Digite o e-mail" required>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <label for="perfil" class="form-label fw-semibold">Perfil de acesso</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
                  <select name="perfil" id="perfil" class="form-select" required>
                    <option value="">Selecione o perfil</option>
                    <option value="ADMIN" {if="$funcionarios.perfil=='ADMIN'"}selected{/if}>Administrador</option>
                    <option value="SUPERVISOR" {if="$funcionarios.perfil=='SUPERVISOR'"}selected{/if}>Supervisor</option>
                    <option value="ASSESSOR" {if="$funcionarios.perfil=='ASSESSOR'"}selected{/if}>Assessor</option>
                  </select>
                </div>
              </div>
              <div class="col-12 col-lg-6">
                <label for="id_usuario" class="form-label fw-semibold">ID do usuário</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                  <input type="text" class="form-control" id="id_usuario" name="id_usuario" value="{$funcionarios.id_usuario}" readonly>
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer d-flex flex-column flex-md-row justify-content-between gap-2">
            <a href="/admin/funcionarios" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-2"></i>Cancelar</a>
            <div class="d-flex flex-column flex-sm-row gap-2">
              <button type="reset" class="btn btn-warning text-white"><i class="fa-solid fa-eraser me-2"></i>Limpar</button>
              <button type="submit" class="btn btn-primary" id="btn-salvar"><i class="fa-solid fa-floppy-disk me-2"></i>Salvar alterações</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script>
  $(function () {
    $('#cpf').mask('000.000.000-00');
    $('#nrphone').mask('(00) 00000-0000');
  });
</script>
